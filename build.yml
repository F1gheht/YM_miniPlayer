# Собирает YMMini-Setup.exe на Windows.
# - при каждом пуше в main: установщик лежит во вкладке Actions → артефакты;
# - при пуше тега v* (например, v1.0.1): создаётся релиз с установщиком.
name: Build installer

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: Build YMMini.exe
        run: >
          pyinstaller --noconfirm --clean --onedir --windowed --name YMMini --icon icon.ico
          --collect-all winrt --hidden-import comtypes.stream --hidden-import websocket ym_mini.py

      - name: Version
        id: ver
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then echo "v=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT";
          else echo "v=$(cat VERSION)" >> "$GITHUB_OUTPUT"; fi

      - name: Build installer
        shell: pwsh
        run: |
          if (-not (Get-Command iscc -ErrorAction SilentlyContinue) -and -not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) {
            choco install innosetup -y --no-progress
          }
          $iscc = (Get-Command iscc -ErrorAction SilentlyContinue).Source
          if (-not $iscc) { $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" }
          & $iscc /Q "/DMyAppVersion=${{ steps.ver.outputs.v }}" installer.iss

      - uses: actions/upload-artifact@v4
        with:
          name: YMMini-Setup
          path: Output/YMMini-Setup.exe

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: Output/YMMini-Setup.exe
          generate_release_notes: true
